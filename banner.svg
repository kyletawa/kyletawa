<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kyle.exe — IT Support Specialist to Penetration Tester">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a141c"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE2C5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DE2C5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DE2C5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2C744" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14919B" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- ambient radar sweep -->
  <g>
    <rect x="-300" y="0" width="300" height="300" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- abstract recon / network graph, right side -->
  <g opacity="0.9">
    <line x1="930" y1="78" x2="1020" y2="55" stroke="#2DE2C5" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="1020" y1="55" x2="1108" y2="108" stroke="#2DE2C5" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="930" y1="78" x2="965" y2="168" stroke="#2DE2C5" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="965" y1="168" x2="1072" y2="198" stroke="#2DE2C5" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="1020" y1="55" x2="1072" y2="198" stroke="#2DE2C5" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="1108" y1="108" x2="1072" y2="198" stroke="#2DE2C5" stroke-opacity="0.2" stroke-width="1.5"/>

    <circle cx="930" cy="78" r="4" fill="#2DE2C5"/>
    <circle cx="1020" cy="55" r="4" fill="#2DE2C5"/>
    <circle cx="965" cy="168" r="4" fill="#2DE2C5"/>
    <circle cx="1072" cy="198" r="4" fill="#2DE2C5"/>

    <!-- target node, pulsing gold -->
    <circle cx="1108" cy="108" r="16" fill="url(#nodeGlow)">
      <animate attributeName="r" values="10;22;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="108" r="5" fill="#F2C744"/>
  </g>

  <!-- identity block -->
  <text x="80" y="92" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="15" letter-spacing="4" fill="#F2C744" opacity="0.9">root@chihata</text>

  <text x="78" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="5" fill="#EAF6F6">KYLE<tspan fill="#2DE2C5">.EXE</tspan></text>

  <text x="80" y="200" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="19" fill="#C9D6DF">
    <tspan>IT Support Specialist</tspan>
    <tspan fill="#2DE2C5" dx="10">-&gt;</tspan>
    <tspan fill="#2DE2C5" dx="10">Penetration Tester</tspan>
  </text>

  <!-- blinking terminal cursor -->
  <rect x="592" y="186" width="11" height="20" fill="#2DE2C5">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- accent rule -->
  <rect x="80" y="222" width="660" height="2" fill="#14919B" fill-opacity="0.45"/>

  <!-- status readout -->
  <text x="80" y="252" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" letter-spacing="1" fill="#7d97a0">
    <tspan fill="#F2C744">●</tspan> Cape Town, ZA<tspan dx="14" fill="#3a4a52">|</tspan><tspan dx="14">Security+ · in progress</tspan><tspan dx="14" fill="#3a4a52">|</tspan><tspan dx="14">eJPT · in progress</tspan>
  </text>
</svg>
